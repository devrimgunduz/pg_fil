volumes:
  pgdata:
services:
  pg_fil:
    build: .
    container_name: pg_fil
    environment:
      POSTGRES_PASSWORD: 123456
      POSTGRES_USER: postgres
    volumes:
      # The whole repository, read-only; docker/init.sh loads each database
      # from it on the first start (when the data volume is empty).
      - .:/pg_fil:ro
      - ./docker/init.sh:/docker-entrypoint-initdb.d/1-pg_fil-init.sh:ro
      - pgdata:/var/lib/postgresql
    ports:
      # Local only: the superuser password above is no secret.
      - "127.0.0.1:5432:5432"
  pgadmin:
    container_name: pg_fil_pgadmin
    image: docker.io/dpage/pgadmin4
    restart: always
    depends_on:
      - pg_fil
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    volumes:
      - "./pgadmin/pgadmin_servers.json:/pgadmin4/servers.json"
      - "./pgadmin/pgadmin_pass:/pgadmin4/pass"
    ports:
      - "127.0.0.1:5050:80"
